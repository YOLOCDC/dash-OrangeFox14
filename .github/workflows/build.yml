name: Build OrangeFox 14.1 vendor_boot

# 完整构建管线：官方 OrangeFox 14.1 sync -> 设备树 -> vendorbootimage
# -> package-vendor-boot.sh（全量校验 + AVB footer）。
#
# Runner：默认标准 ubuntu-22.04（与 TWRP-Recovery-Builder-2024 同款精简方案：
# slimhub_actions 清理 + 24G swap）。树规模 ≈674 项目（twrp-default.xml +
# remove-minimal.xml 裁剪），TWRP-A16 的 990 项目都能跑，本树标准 runner 可行。
# 如需更大机器可在 workflow_dispatch 的 runner 输入覆盖。

on:
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner label（默认 ubuntu-22.04；可填 larger runner 或 self-hosted 标签）
        required: true
        default: ubuntu-22.04
      upload_release:
        description: 上传镜像到 GitHub Release（draft）
        type: boolean
        default: false
      release_tag:
        description: Release tag（upload_release=true 时使用；留空则用 run id）
        required: false
        default: ''
  push:
    branches: [main]

env:
  ALLOW_MISSING_DEPENDENCIES: "true"
  LC_ALL: "C"
  FOX_BUILD_DEVICE: dash
  FOX_TREE: ${{ github.workspace }}/fox_14.1
  DEVICE_TREE: ${{ github.workspace }}/device-tree

jobs:
  build:
    name: Build OrangeFox 14.1 by ${{ github.actor }}
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-22.04' }}
    if: github.event.repository.owner.id == github.event.sender.id
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - name: Check Out
        uses: actions/checkout@v4
        with:
          path: device-tree

      - name: Display Inputs
        run: |
          echo "::group::Build Configuration"
          echo "Runner: ${{ github.event.inputs.runner || 'ubuntu-22.04' }}"
          echo "Upload Release: ${{ github.event.inputs.upload_release }}"
          echo "Release Tag: ${{ github.event.inputs.release_tag }}"
          echo "::endgroup::"

      - name: Disk check (before cleanup)
        run: df -h /

      # 与 TWRP-Recovery-Builder-2024 相同的 runner 精简方案
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Disk check (after cleanup)
        run: df -h /

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Prepare the environment
        run: |
          sudo apt update
          sudo apt -y upgrade
          sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
            lib32ncurses5-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev libxml2-utils \
            xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev \
            libsdl1.2-dev libwxgtk3.0-gtk3-dev lzop pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libtinfo5 \
            libgflags-dev
          sudo add-apt-repository universe
          sudo apt -y install libncurses5
          git config --global user.name "OrangeFox Builder"
          git config --global user.email "builder@orangefox.local"

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Install Git-Repo
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Install Python 2 (legacy build helpers)
        continue-on-error: true
        run: |
          sudo apt -y install python2
          cd /usr/bin
          sudo ln -sf python2 python

      - name: Sync OrangeFox 14.1 sources (official sync script)
        run: |
          git clone --depth=1 https://gitlab.com/OrangeFox/sync.git /tmp/ofox-sync
          cd /tmp/ofox-sync
          ./orangefox_sync.sh --branch 14.1 --path "$FOX_TREE"
        timeout-minutes: 180

      - name: Install device tree
        run: |
          mkdir -p "$FOX_TREE/device/xiaomi/dash"
          cp -a "$DEVICE_TREE/." "$FOX_TREE/device/xiaomi/dash/"
          rm -rf "$FOX_TREE/device/xiaomi/dash/.git"
          ls -la "$FOX_TREE/device/xiaomi/dash/" | head -30

      - name: Apply recovery source patches (optional)
        run: |
          set -e
          if ls "$DEVICE_TREE"/patches/*.patch >/dev/null 2>&1; then
            for p in "$DEVICE_TREE"/patches/*.patch; do
              echo "Applying $p"
              git -C "$FOX_TREE" apply --check "$p"
              git -C "$FOX_TREE" apply "$p"
            done
          else
            echo "patches/ 不存在 —— 构建未打补丁的 OrangeFox 源码（无 EV_FF 触觉补丁）"
          fi

      - name: Build vendor_boot
        run: |
          cd "$FOX_TREE"
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_dash-ap2a-eng
          m installclean
          m -j$(nproc --all) vendorbootimage
        timeout-minutes: 300

      - name: Package release image
        run: |
          SHORT_SHA=$(git -C "$DEVICE_TREE" rev-parse --short HEAD)
          DATE=$(date +%Y%m%d)
          IMG="vendor_boot-dash-${DATE}-${SHORT_SHA}.img"
          echo "OUTPUT_IMAGE=$FOX_TREE/$IMG" >> "$GITHUB_ENV"
          bash "$FOX_TREE/device/xiaomi/dash/package-vendor-boot.sh" \
            "$FOX_TREE" "$FOX_TREE/$IMG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor_boot-dash
          path: |
            ${{ env.OUTPUT_IMAGE }}
            ${{ env.OUTPUT_IMAGE }}.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Publish GitHub Release (draft)
        if: ${{ github.event.inputs.upload_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.OUTPUT_IMAGE }}
            ${{ env.OUTPUT_IMAGE }}.sha256
          tag_name: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || format('vendor_boot-{0}', github.run_id) }}
          name: dash OrangeFox 14.1 ${{ github.event.inputs.release_tag }}
          draft: true
          body: |
            Device: dash (Redmi Turbo 5 Max, MT6991Z)
            Tree: lakitu12/dash-OrangeFox14 @ ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Job summary
        if: ${{ always() }}
        run: |
          {
            echo "## 构建结果"
            echo "- Image: \`${{ env.OUTPUT_IMAGE }}\`"
            ls -la "${{ env.OUTPUT_IMAGE }}" "${{ env.OUTPUT_IMAGE }}.sha256" 2>/dev/null || true
            echo "- 磁盘:"
            df -h /
          } >> "$GITHUB_STEP_SUMMARY"
